<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista</title>
</head>

<body>
    <h1>Lista</h1>
    <p>Si no son gaspi no van a poder ver la lista por motivos de seguridad</p>
    <p>No se preocupen, no aparece ni en orden ni quien envio cada mensaje</p>
    <form id="login">
        <input id="clave" type="password" placeholder="Contraseña" required>
        <button type="submit">Ver</button>
    </form>
    <p id="mensaje"></p>
    <ul id="lista"></ul>
    <button id="btnBorrar" style="display:none">Borrar lista</button>
    <a href="index.html">Volver</a>

    <script>
        const lista = document.getElementById('lista');
        const mensaje = document.getElementById('mensaje');
        const login = document.getElementById('login');
        const btnBorrar = document.getElementById('btnBorrar');

        let clave = ''; // afuera, para que la vean el submit y borrar

        btnBorrar.addEventListener('click', async () => {
            if (!confirm('¿Seguro que querés borrar toda la lista?')) return;
            try {
                mensaje.textContent = 'Borrando...';
                const res = await fetch('/api/set?clave=' + encodeURIComponent(clave), { method: 'DELETE' });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);
                mensaje.textContent = data.mensaje;
                lista.innerHTML = '<li>Todavía no hay nada</li>';
            } catch (err) {
                mensaje.textContent = 'Error: ' + err.message;
            }
        });

        login.addEventListener('submit', (e) => {
            e.preventDefault();
            clave = document.getElementById('clave').value; // sin const: usa la de afuera
            mensaje.textContent = 'Cargando...';

            fetch('/api/set?clave=' + encodeURIComponent(clave))
                .then(async (res) => {
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error);
                    return data;
                })
                .then((valores) => {
                    mensaje.textContent = '';
                    login.style.display = 'none';
                    btnBorrar.style.display = 'inline-block';
                    lista.innerHTML = '';
                    if (valores.length === 0) {
                        lista.innerHTML = '<li>Todavía no hay nada</li>';
                        return;
                    }
                    for (const v of valores) {
                        const li = document.createElement('li');
                        li.textContent = v;
                        lista.appendChild(li);
                    }
                })
                .catch((err) => {
                    mensaje.textContent = 'Error: ' + err.message;
                });
        });
    </script>
</body>

</html>
